spring.application.name=sistema-salgados

# Segurança (spec, seção 13): escutar somente em localhost
server.address=127.0.0.1
server.port=8080

# Banco SQLite fora da pasta do código
spring.datasource.url=jdbc:sqlite:${user.home}/SistemaSalgados/data/empresa.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite aceita uma escrita por vez; um pool de 1 conexão evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Executa schema.sql a cada inicialização (é idempotente: CREATE ... IF NOT EXISTS)
spring.sql.init.mode=always